"07:30"}]}],"users":[{"id":"user_bch_admin","username":"bch.dienbien","password":"123","fullName":"Đại tá Phan Văn Hóa - Chỉ huy trưởng BĐBP Tỉnh","role":"ban_chi_huy","stationId":"ALL","stationName":"Ban Chỉ huy BĐBP Tỉnh Điện Biên","phone":"02153.825.296","status":"active"},{"id":"user_dan_sungalu","username":"sungalu","password":"123","fullName":"Sùng A Lử (Trưởng bản Tá Miếu, Xã Sín Thầu)","role":"dan","stationId":"don_apachai","stationName":"Đồn Biên phòng A Pa Chải","phone":"0912.345.678","status":"active"},{"id":"user_dan_vangapao","username":"vangapao","password":"123","fullName":"Vàng A Páo (Người dân Xã Na Ư, Huyện Điện Biên)","role":"dan","stationId":"don_taytrang","stationName":"Đồn Biên phòng CKQT Tây Trang","phone":"0988.777.666","status":"active"},{"id":"user_don_apachai","username":"don.apachai","password":"123","fullName":"Thượng tá Nguyễn Đức Cảnh - Đồn trưởng Đồn BP A Pa Chải","role":"don_bp","stationId":"don_apachai","stationName":"Đồn Biên phòng A Pa Chải","phone":"02153.871.115","status":"active"},{"id":"user_don_lengsusin","username":"don.lengsusin","password":"123","fullName":"Trung tá Lò Văn Đông - Đồn trưởng Đồn BP Leng Su Sìn","role":"don_bp","stationId":"don_lengsusin","stationName":"Đồn Biên phòng Leng Su Sìn","phone":"02153.871.220","status":"active"},{"id":"user_don_taytrang","username":"don.taytrang","password":"123","fullName":"Thượng tá Vũ Văn Biển - Đồn trưởng Đồn BP CKQT Tây Trang","role":"don_bp","stationId":"don_taytrang","stationName":"Đồn Biên phòng CKQT Tây Trang","phone":"02153.956.113","status":"active"}],"auditLogs":[]};
    const STORAGE_KEY = "BDBP_DIEN_BIEN_SHARED_STATE_V2";
    const bc = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("bdbp_sync_channel") : null;
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : INITIAL_DATA;
      } catch (e) { return INITIAL_DATA; }
    }
    function saveState(next) {
      state = next;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      if (bc) bc.postMessage({ type: "SYNC" });
      renderCms();
    }
    if (bc) bc.onmessage = () => { state = loadState(); renderCms(); };
    let state = loadState();
    let cmsSection = "overview";
    function setSection(sec) { cmsSection = sec; renderCms(); }
    function addUser(e) {
      e.preventDefault();
      const username = document.getElementById("uName").value.trim();
      const password = document.getElementById("uPass").value.trim() || "123";
      const fullName = document.getElementById("uFull").value.trim();
      const role = document.getElementById("uRole").value;
      const stId = document.getElementById("uStation") ? document.getElementById("uStation").value : "ALL";
      const phone = document.getElementById("uPhone").value.trim() || "0912.000.000";
      if (!username || !fullName) return;
      const stObj = role === "ban_chi_huy" ? { id: "ALL", name: "Ban Chỉ huy BĐBP Tỉnh Điện Biên" } : (state.stations.find(s => s.id === stId) || state.stations[0]);
      state.users.unshift({ id: "user_" + Date.now(), username, password, fullName, role, stationId: stObj.id, stationName: stObj.name, phone, status: "active" });
      saveState(state);
    }
    function toggleUserLock(id) {
      state.users = state.users.map(u => u.id === id ? { ...u, status: u.status === "locked" ? "active" : "locked" } : u);
      saveState(state);
    }
    function deleteUser(id) {
      state.users = state.users.filter(u => u.id !== id);
      saveState(state);
    }
    function addStation(e) {
      e.preventDefault();
      const code = document.getElementById("sCode").value.trim() || "DBP-725";
      const name = document.getElementById("sName").value.trim();
      const area = document.getElementById("sArea").value.trim();
      const markers = document.getElementById("sMarkers").value.trim() || "Tuyến biên giới Điện Biên";
      const commander = document.getElementById("sCmd").value.trim() || "Ban Chỉ huy Đồn";
      const hotline = document.getElementById("sPhone").value.trim() || "02153.825.296";
      if (!name || !area) return;
      state.stations.unshift({ id: "don_" + Date.now(), code, name, area, markers, commander, hotline, status: "active" });
      saveState(state);
    }
    function deleteStation(id) {
      state.stations = state.stations.filter(s => s.id !== id);
      saveState(state);
    }
    function cmsModeratePost(id, status) {
      state.posts = state.posts.map(p => p.id === id ? { ...p, status, approvedBy: "Ban Chỉ huy BĐBP Tỉnh (CMS)" } : p);
      saveState(state);
    }
    function cmsDeletePost(id) {
      state.posts = state.posts.filter(p => p.id !== id);
      saveState(state);
    }
    function cmsUpdateReport(id, status, note) {
      const now = new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
      state.reports = state.reports.map(r => r.id === id ? { ...r, status, timeline: [...(r.timeline||[]), { actor: "Web CMS Quản Trị", action: note, time: now }] } : r);
      saveState(state);
    }
    function renderCms() {
      const root = document.getElementById("cmsRoot");
      const navItems = [
        { id: "overview", label: "📊 1. Tổng Quan Hệ Thống" },
        { id: "users", label: "👥 2. Quản Lý Tài Khoản (" + state.users.length + ")" },
        { id: "stations", label: "🛡️ 3. Quản Lý Đồn BP (" + state.stations.length + ")" },
        { id: "posts", label: "📰 4. Kiểm Duyệt Bài Đăng (" + state.posts.length + ")" },
        { id: "reports", label: "🚨 5. Điều Phối Tin Báo (" + state.reports.length + ")" }
      ];
      root.innerHTML = `
        <aside class="w-full md:w-64 bg-[#002814] text-white p-4 flex flex-col justify-between shrink-0">
          <div class="space-y-5">
            <div class="flex items-center gap-3 pb-4 border-b border-emerald-800">
              <img src="${state.appConfig.logoUrl}" class="w-11 h-11 rounded-full bg-white p-0.5 object-contain"/>
              <div><div class="font-black text-xs text-yellow-400 uppercase">WEB CMS QUẢN TRỊ</div><div class="text-[11px] text-emerald-200">Firebase: ${state.appConfig.firebaseProjectId}</div></div>
            </div>
            <nav class="space-y-1.5 text-xs">
              ${navItems.map(item => `<button onclick="setSection('${item.id}')" class="w-full text-left px-3.5 py-2.5 rounded-xl font-black transition ${cmsSection===item.id?'bg-yellow-400 text-[#002814]':'text-emerald-100 hover:bg-emerald-900'}">${item.label}</button>`).join("")}
            </nav>
          </div>
          <div class="pt-4 border-t border-emerald-800 text-[11px] space-y-2">
            <a href="index.html" class="block text-center bg-emerald-700 hover:bg-emerald-600 text-white font-black py-2 rounded-xl">📱 Mở WebApp (index.html)</a>
          </div>
        </aside>
        <main class="flex-1 p-6 space-y-6 overflow-y-auto text-xs">
          ${cmsSection === "overview" ? `<div class="bg-white p-5 rounded-2xl shadow-sm border flex justify-between items-center"><div><h2 class="text-lg font-black text-[#004222] uppercase">Trung Tâm Quản Trị Hệ Thống (Web CMS)</h2><p class="text-slate-500">Dự án Firebase: ${state.appConfig.firebaseProjectId} (${state.appConfig.firebaseWebAppId})</p></div></div><div class="grid grid-cols-1 sm:grid-cols-4 gap-4"><div class="bg-white p-5 rounded-2xl border-l-4 border-[#006837] shadow-sm"><div class="text-slate-500 font-bold">Tổng Tài Khoản</div><div class="text-2xl font-black mt-1">${state.users.length}</div></div><div class="bg-white p-5 rounded-2xl border-l-4 border-emerald-600 shadow-sm"><div class="text-slate-500 font-bold">Đồn Biên Phòng</div><div class="text-2xl font-black mt-1">${state.stations.length}</div></div><div class="bg-white p-5 rounded-2xl border-l-4 border-amber-500 shadow-sm"><div class="text-slate-500 font-bold">Bài Chờ Duyệt</div><div class="text-2xl font-black text-amber-600 mt-1">${state.posts.filter(p=>p.status==="pending").length}</div></div><div class="bg-white p-5 rounded-2xl border-l-4 border-red-600 shadow-sm"><div class="text-slate-500 font-bold">Tổng Tin Báo</div><div class="text-2xl font-black text-red-600 mt-1">${state.reports.length}</div></div></div>` : ""}
          ${cmsSection === "users" ? `<div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3"><h3 class="font-black text-sm text-[#004222] uppercase">➕ Tạo Tài Khoản Mới</h3><form onsubmit="addUser(event)" class="space-y-2.5"><input id="uName" required placeholder="Tên đăng nhập (Username) *" class="w-full p-2.5 border rounded-xl font-bold"/><input id="uPass" value="123" required placeholder="Mật khẩu *" class="w-full p-2.5 border rounded-xl"/><input id="uFull" required placeholder="Họ tên & Chức vụ *" class="w-full p-2.5 border rounded-xl font-bold"/><select id="uRole" class="w-full p-2.5 border rounded-xl font-bold text-[#006837] bg-emerald-50"><option value="dan">1. Người dân</option><option value="don_bp">2. Đồn Biên phòng</option><option value="ban_chi_huy">3. Ban Chỉ huy (Admin)</option></select><select id="uStation" class="w-full p-2.5 border rounded-xl font-bold">${state.stations.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select><input id="uPhone" placeholder="Số điện thoại" class="w-full p-2.5 border rounded-xl"/><button type="submit" class="w-full py-3 bg-[#006837] text-yellow-300 font-black uppercase rounded-xl">Lưu Tài Khoản</button></form></div><div class="lg:col-span-2 bg-white p-5 rounded-2xl border shadow-sm space-y-2.5"><h3 class="font-black text-sm text-[#004222] uppercase">👥 Danh Sách Tài Khoản (${state.users.length})</h3>${state.users.map(u=>`<div class="p-3.5 rounded-xl border flex flex-wrap justify-between items-center gap-2"><div><span class="px-2 py-0.5 rounded bg-emerald-100 text-[#006837] font-black uppercase mr-2">${u.role}</span><strong>${u.fullName}</strong><div class="text-slate-500 mt-1">Username: <b>${u.username}</b> • MK: <code>${u.password}</code> • Đồn: <b>${u.stationName}</b></div></div><div class="flex gap-2"><button onclick="toggleUserLock('${u.id}')" class="bg-amber-100 text-amber-900 font-bold px-3 py-1.5 rounded-xl">${u.status==="locked"?"Mở khóa":"Khóa"}</button><button onclick="deleteUser('${u.id}')" class="bg-red-100 text-red-700 font-bold px-3 py-1.5 rounded-xl">Xóa</button></div></div>`).join("")}</div></div>` : ""}
          ${cmsSection === "stations" ? `<div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3"><h3 class="font-black text-sm text-[#004222] uppercase">➕ Thêm Đồn Biên Phòng</h3><form onsubmit="addStation(event)" class="space-y-2.5"><input id="sCode" placeholder="Mã Đồn (VD: DBP-715)" class="w-full p-2.5 border rounded-xl font-bold"/><input id="sName" required placeholder="Tên Đồn Biên phòng *" class="w-full p-2.5 border rounded-xl font-bold"/><input id="sArea" required placeholder="Địa bàn Xã / Huyện *" class="w-full p-2.5 border rounded-xl"/><input id="sMarkers" placeholder="Cột mốc phụ trách" class="w-full p-2.5 border rounded-xl"/><input id="sCmd" placeholder="Họ tên Đồn trưởng" class="w-full p-2.5 border rounded-xl"/><input id="sPhone" placeholder="SĐT Trực ban" class="w-full p-2.5 border rounded-xl"/><button type="submit" class="w-full py-3 bg-[#006837] text-yellow-300 font-black uppercase rounded-xl">Lưu Đồn BP</button></form></div><div class="lg:col-span-2 space-y-2.5">${state.stations.map(s=>`<div class="bg-white p-4 rounded-2xl border shadow-sm flex justify-between items-center"><div><span class="bg-[#006837] text-yellow-300 font-mono font-black px-2 py-0.5 rounded">${s.code}</span><strong class="text-sm ml-2">${s.name}</strong><p class="text-slate-600 mt-1">Địa bàn: ${s.area} • Cột mốc: ${s.markers}</p><p class="text-[#006837] font-bold">Chỉ huy: ${s.commander} • ĐT: ${s.hotline}</p></div><button onclick="deleteStation('${s.id}')" class="bg-red-100 text-red-700 font-bold px-3 py-1.5 rounded-xl">Xóa</button></div>`).join("")}</div></div>` : ""}
          ${cmsSection === "posts" ? `<div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3"><h3 class="font-black text-sm text-[#004222] uppercase">📰 Kiểm Duyệt Bài Đăng (${state.posts.length})</h3>${state.posts.map(p=>`<div class="p-4 rounded-xl border flex flex-wrap justify-between items-center gap-3"><div><span class="font-black text-[#006837]">${p.stationName}</span> • <b>${p.authorName}</b> • Trạng thái: <b class="uppercase">${p.status}</b><h4 class="font-black text-sm mt-1">${p.title}</h4><p class="text-slate-600">${p.content}</p></div><div class="flex gap-2">${p.status!=="approved"?`<button onclick="cmsModeratePost('${p.id}','approved')" class="bg-[#006837] text-yellow-300 font-black px-3 py-1.5 rounded-xl">✓ Duyệt</button>`:""}<button onclick="cmsModeratePost('${p.id}','rejected')" class="bg-amber-100 text-amber-900 font-bold px-3 py-1.5 rounded-xl">Từ chối</button><button onclick="cmsDeletePost('${p.id}')" class="bg-red-100 text-red-700 font-bold px-3 py-1.5 rounded-xl">Xóa</button></div></div>`).join("")}</div>` : ""}
          ${cmsSection === "reports" ? `<div class="bg-white p-5 rounded-2xl border shadow-sm space-y-3"><h3 class="font-black text-sm text-[#004222] uppercase">🚨 Điều Phối Tin Báo Toàn Tỉnh (${state.reports.length})</h3>${state.reports.map(r=>`<div class="p-4 rounded-xl border flex flex-wrap justify-between items-center gap-3"><div><span class="bg-red-600 text-white font-mono font-black px-2 py-0.5 rounded">${r.code}</span> <strong class="text-[#006837]">${r.stationName}</strong> • Trạng thái: <b class="uppercase">${r.status}</b><h4 class="font-black text-sm mt-1">${r.title}</h4><p class="text-slate-600">${r.description}</p></div><div class="flex gap-2"><button onclick="cmsUpdateReport('${r.id}','verifying','Ban Chỉ huy chỉ đạo xác minh khẩn cấp')" class="bg-[#006837] text-yellow-300 font-black px-3 py-1.5 rounded-xl">Chỉ đạo xác minh</button><button onclick="cmsUpdateReport('${r.id}','resolved','Đã xử lý hoàn tất hồ sơ')" class="bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl">Đóng hồ sơ</button></div></div>`).join("")}</div>` : ""}
        </main>`;
    }
    renderCms();
  </script>
</body>
</html>
