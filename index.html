<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bộ đội Biên Phòng Điện Biên</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f0f4f1; }
    .bg-bp-green { background-color: #006837; }
    .bg-bp-dark { background-color: #004d28; }
    .text-bp-green { color: #006837; }
    .border-bp-green { border-color: #006837; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- LOGO BỘ ĐỘI BIÊN PHÒNG VIỆT NAM (SVG CHUẨN THEO HÌNH TẢI LÊN) ---
    const BorderGuardLogo = ({ size = 64, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 300 300" className={className} xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="textArcTop" d="M 38,150 A 112,112 0 1,1 262,150" />
          <clipPath id="innerCircle">
            <circle cx="150" cy="150" r="95" />
          </clipPath>
        </defs>
        {/* Viền ngoài trắng & xanh đậm */}
        <circle cx="150" cy="150" r="146" fill="#ffffff" stroke="#006837" strokeWidth="6" />
        <circle cx="150" cy="150" r="96" fill="#fff200" stroke="#006837" strokeWidth="3" />

        {/* Nội dung bên trong vòng tròn trung tâm */}
        <g clipPath="url(#innerCircle)">
          {/* Nền vàng */}
          <rect x="50" y="50" width="200" height="200" fill="#fff200" />
          {/* Núi xanh */}
          <polygon points="90,195 140,75 185,195" fill="#0072bc" />
          <polygon points="135,195 170,95 215,195" fill="#008fd5" />
          <polygon points="50,195 250,195 250,135 205,115 150,155 85,125 50,150" fill="#0054a6" opacity="0.85" />
          
          {/* Sóng nước xanh - trắng ở đáy */}
          <rect x="50" y="195" width="200" height="60" fill="#ffffff" />
          <path d="M 50,208 Q 75,198 100,208 T 150,208 T 200,208 T 250,208 L 250,220 L 50,220 Z" fill="#0072bc" />
          <path d="M 50,228 Q 75,218 100,228 T 150,228 T 200,228 T 250,228 L 250,240 L 50,240 Z" fill="#0072bc" />

          {/* Ngựa phi & Chiến sĩ Biên phòng */}
          <g transform="translate(5, -5)">
            {/* Thân ngựa nâu đỏ */}
            <path d="M 75,180 L 105,155 L 125,145 L 185,140 L 210,115 L 222,125 L 205,155 L 230,175 L 222,182 L 195,165 L 130,168 L 95,192 Z" fill="#a62626" stroke="#ffffff" strokeWidth="1.5" />
            {/* Đuôi ngựa */}
            <path d="M 105,152 Q 80,145 68,162 Q 85,168 105,158 Z" fill="#a62626" stroke="#ffffff" strokeWidth="1.2" />
            {/* Áo choàng & Chiến sĩ áo xanh */}
            <path d="M 145,145 L 140,108 L 165,108 L 172,142 Z" fill="#006837" stroke="#ffffff" strokeWidth="1.2" />
            {/* Áo choàng bay */}
            <path d="M 145,112 Q 110,98 88,115 Q 112,128 142,124 Z" fill="#006837" stroke="#ffffff" strokeWidth="1.2" />
            {/* Mũ sắt xanh & Đầu chiến sĩ */}
            <circle cx="158" cy="98" r="8" fill="#ffffff" />
            <path d="M 148,96 Q 158,84 168,96 Z" fill="#006837" />
            {/* Súng trường đen */}
            <line x1="132" y1="145" x2="168" y2="122" stroke="#111111" strokeWidth="4" />
          </g>
        </g>

        {/* Vòng tròn viền lại khung giữa */}
        <circle cx="150" cy="150" r="96" fill="none" stroke="#006837" strokeWidth="3.5" />

        {/* Chữ BỘ ĐỘI BIÊN PHÒNG VIỆT NAM */}
        <text fill="#006837" fontSize="17.5" fontWeight="800" letterSpacing="1.2">
          <textPath href="#textArcTop" startOffset="50%" textAnchor="middle">
            BỘ ĐỘI BIÊN PHÒNG VIỆT NAM
          </textPath>
        </text>

        {/* 2 Ngôi sao đỏ viền vàng 2 bên */}
        <polygon points="32,140 35,148 44,148 37,153 39,161 32,156 25,161 27,153 20,148 29,148" fill="#ed1c24" stroke="#fff200" strokeWidth="1" />
        <polygon points="268,140 271,148 280,148 273,153 275,161 268,156 261,161 263,153 256,148 265,148" fill="#ed1c24" stroke="#fff200" strokeWidth="1" />

        {/* Cột mốc / Cấp hiệu trang trí hai bên dưới */}
        <g fill="#006837">
          <rect x="28" y="175" width="18" height="10" rx="2" transform="rotate(20 37 180)" />
          <rect x="48" y="218" width="18" height="10" rx="2" transform="rotate(45 57 223)" />
          <rect x="82" y="250" width="18" height="10" rx="2" transform="rotate(65 91 255)" />
          <rect x="254" y="175" width="18" height="10" rx="2" transform="rotate(-20 263 180)" />
          <rect x="234" y="218" width="18" height="10" rx="2" transform="rotate(-45 243 223)" />
          <rect x="200" y="250" width="18" height="10" rx="2" transform="rotate(-65 209 255)" />
        </g>

        {/* Ngày truyền thống 3 - 3 - 1959 */}
        <text x="150" y="282" textAnchor="middle" fill="#006837" fontSize="22" fontWeight="900" letterSpacing="2">
          3 - 3 - 1959
        </text>
      </svg>
    );

    // --- DANH MỤC ĐỒN BIÊN PHÒNG & ĐỊA BÀN ĐIỆN BIÊN ---
    const DON_BIEN_PHONG = [
      { id: 'all', name: 'Toàn tỉnh Điện Biên', station: 'Ban Chỉ huy BĐBP Tỉnh Điện Biên' },
      { id: 'apachai', name: 'Xã Sín Thầu (Mường Nhé)', station: 'Đồn Biên phòng A Pa Chải' },
      { id: 'lengsusin', name: 'Xã Leng Su Sìn (Mường Nhé)', station: 'Đồn Biên phòng Leng Su Sìn' },
      { id: 'napung', name: 'Xã Na Cô Sa (Nậm Pồ)', station: 'Đồn Biên phòng Na Cô Sa' },
      { id: 'taytrang', name: 'Xã Na Ư (H. Điện Biên)', station: 'Đồn Biên phòng Cửa khẩu Quốc tế Tây Trang' },
      { id: 'pathom', name: 'Xã Pa Thơm (H. Điện Biên)', station: 'Đồn Biên phòng Pa Thơm' },
      { id: 'muongmon', name: 'Xã Mường Mơn (Mường Chà)', station: 'Đồn Biên phòng Mường Mơn' },
    ];

    function App() {
      // Màn hình đăng nhập hay vào app
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'register'

      // 3 Cấp tài khoản: 'dan' (Người dân), 'don' (Đồn Biên Phòng), 'bch' (Ban Chỉ huy)
      const [role, setRole] = useState('dan');
      const [assignedStationId, setAssignedStationId] = useState('apachai'); // Đồn đang phụ trách nếu role === 'don'
      const [activeTab, setActiveTab] = useState('feed'); // 'feed' | 'report' | 'moderation' | 'inbox'
      const [selectedAreaFilter, setSelectedAreaFilter] = useState('all');

      // Dữ liệu Bài viết Cộng đồng (Cần duyệt từ Đồn BP hoặc Ban Chỉ huy)
      const [posts, setPosts] = useState([
        {
          id: 101,
          author: 'Đồn Biên phòng A Pa Chải',
          authorRole: 'don',
          areaId: 'apachai',
          time: '2 giờ trước',
          content: 'Sáng nay, tổ tuần tra song phương Đồn Biên phòng A Pa Chải phối hợp cùng nhân dân bản Tá Miếu phát quang đường tuần tra khu vực Mốc quốc giới số 0.',
          status: 'approved',
          approvedBy: 'Ban Chỉ huy BĐBP Tỉnh',
          likes: 48
        },
        {
          id: 102,
          author: 'Lò Văn Páo (Người dân bản Sín Thầu)',
          authorRole: 'dan',
          areaId: 'apachai',
          time: '35 phút trước',
          content: 'Bà con xã Sín Thầu cảm ơn các cán bộ quân y Đồn Biên phòng A Pa Chải đã khám bệnh và cấp phát thuốc miễn phí cho trẻ em trong bản dịp cuối tuần.',
          status: 'approved',
          approvedBy: 'Đồn Biên phòng A Pa Chải',
          likes: 32
        },
        {
          id: 103,
          author: 'Thào Aình (Người dân xã Na Ư)',
          authorRole: 'dan',
          areaId: 'taytrang',
          time: 'Vừa xong',
          content: 'Tuyến đường lên khu vực biên giới xã Na Ư sau trận mưa đêm qua có một số điểm sạt lở đất đá nhỏ, bà con đi nương chú ý an toàn nhé.',
          status: 'pending',
          approvedBy: null,
          likes: 0
        }
      ]);

      // Dữ liệu Tin báo (Tự động gửi tới Đồn Biên phòng nơi xảy ra vụ việc + Ban Chỉ huy)
      const [reports, setReports] = useState([
        {
          id: 'TB-2026-01',
          sender: 'Giàng A Súa (Người dân)',
          areaId: 'apachai',
          targetStation: 'Đồn Biên phòng A Pa Chải',
          ccCommand: 'Ban Chỉ huy BĐBP Tỉnh Điện Biên',
          category: 'Vượt biên trái phép / Người lạ mặt',
          title: 'Phát hiện 3 người lạ mặt gần khu vực đường mòn mốc số 2',
          description: 'Khoảng 17h30 chiều nay khi đi thu hoạch thảo quả về, tôi phát hiện 3 người lạ mặt mang vác balo lớn di chuyển khuất vào rừng khu vực giáp ranh xã Sín Thầu.',
          priority: 'urgent',
          status: 'received',
          time: '15 phút trước',
          history: [
            { step: 'Đã gửi tin báo tự động tới Đồn BP A Pa Chải & Ban Chỉ huy Tỉnh', time: '15 phút trước' },
            { step: 'Đồn Biên phòng A Pa Chải đã tiếp nhận & cử tổ công tác xác minh', time: '5 phút trước' }
          ]
        },
        {
          id: 'TB-2026-02',
          sender: 'Quàng Văn Hặc (Trưởng bản Pa Thơm)',
          areaId: 'pathom',
          targetStation: 'Đồn Biên phòng Pa Thơm',
          ccCommand: 'Ban Chỉ huy BĐBP Tỉnh Điện Biên',
          category: 'An ninh trật tự / Tệ nạn',
          title: 'Trình báo đối tượng khả nghi lôi kéo thanh niên bản',
          description: 'Có 1 đối tượng từ địa phương khác đến bản Pa Thơm có biểu hiện rủ rê thanh niên vượt biên lao động không giấy tờ.',
          priority: 'high',
          status: 'submitted',
          time: '1 giờ trước',
          history: [
            { step: 'Đã gửi tin báo tự động tới Đồn BP Pa Thơm & Ban Chỉ huy Tỉnh', time: '1 giờ trước' }
          ]
        }
      ]);

      // State form tạo bài viết mới
      const [newPostContent, setNewPostContent] = useState('');
      const [newPostArea, setNewPostArea] = useState('apachai');

      // State form gửi tin báo mới
      const [reportArea, setReportArea] = useState('apachai');
      const [reportCategory, setReportCategory] = useState('Vượt biên trái phép / Người lạ mặt');
      const [reportTitle, setReportTitle] = useState('');
      const [reportDesc, setReportDesc] = useState('');
      const [reportPriority, setReportPriority] = useState('high');
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 4500);
      };

      // Xử lý đăng bài mới
      const handleCreatePost = (e) => {
        e.preventDefault();
        if (!newPostContent.trim()) return;
        const isOfficial = role !== 'dan';
        const stationObj = DON_BIEN_PHONG.find(d => d.id === newPostArea);
        const newPost = {
          id: Date.now(),
          author: role === 'dan' ? 'Người dân biên giới' : (role === 'don' ? stationObj.station : 'Ban Chỉ huy BĐBP Tỉnh Điện Biên'),
          authorRole: role,
          areaId: newPostArea,
          time: 'Vừa xong',
          content: newPostContent,
          status: isOfficial ? 'approved' : 'pending',
          approvedBy: isOfficial ? 'Đăng trực tiếp từ đơn vị' : null,
          likes: 0
        };
        setPosts([newPost, ...posts]);
        setNewPostContent('');
        if (isOfficial) {
          showToast('Đã đăng bài thông báo chính thức lên Bảng tin!');
        } else {
          showToast(`Bài viết đã được gửi! Đang chờ ${stationObj.station} hoặc Ban Chỉ huy phê duyệt.`);
        }
      };

      // Xử lý duyệt bài của Đồn BP hoặc Ban Chỉ huy
      const handleApprovePost = (postId) => {
        const approverName = role === 'bch'
          ? 'Ban Chỉ huy BĐBP Tỉnh Điện Biên'
          : DON_BIEN_PHONG.find(d => d.id === assignedStationId)?.station;

        setPosts(posts.map(p => p.id === postId ? { ...p, status: 'approved', approvedBy: approverName } : p));
        showToast(`Đã phê duyệt bài viết hiển thị lên Bảng tin công khai!`);
      };

      const handleRejectPost = (postId) => {
        setPosts(posts.filter(p => p.id !== postId));
        showToast('Đã từ chối và gỡ bài viết.');
      };

      // Xử lý người dân gửi tin báo -> Tự động định tuyến tới Đồn BP khu vực + Ban Chỉ huy
      const handleSendReport = (e) => {
        e.preventDefault();
        if (!reportTitle.trim() || !reportDesc.trim()) return;
        const targetObj = DON_BIEN_PHONG.find(d => d.id === reportArea);
        const newRep = {
          id: `TB-2026-0${reports.length + 1}`,
          sender: 'Người dân địa bàn ( Đã xác thực )',
          areaId: reportArea,
          targetStation: targetObj.station,
          ccCommand: 'Ban Chỉ huy BĐBP Tỉnh Điện Biên',
          category: reportCategory,
          title: reportTitle,
          description: reportDesc,
          priority: reportPriority,
          status: 'submitted',
          time: 'Vừa xong',
          history: [
            {
              step: `Hệ thống tự động chuyển đồng thời tới [${targetObj.station}] và [Ban Chỉ huy BĐBP Tỉnh Điện Biên]`,
              time: 'Vừa xong'
            }
          ]
        };
        setReports([newRep, ...reports]);
        setReportTitle('');
        setReportDesc('');
        showToast(`Đã gửi tin báo khẩn! Tin đã chuyển thẳng tới ${targetObj.station} VÀ Ban Chỉ huy BĐBP Tỉnh.`);
      };

      // Cập nhật trạng thái xử lý tin báo
      const handleUpdateReportStatus = (repId, newStatus, actionText) => {
        const actorName = role === 'bch'
          ? 'Ban Chỉ huy BĐBP Tỉnh'
          : DON_BIEN_PHONG.find(d => d.id === assignedStationId)?.station;

        setReports(reports.map(r => {
          if (r.id !== repId) return r;
          return {
            ...r,
            status: newStatus,
            history: [...r.history, { step: `${actorName}: ${actionText}`, time: 'Vừa xong' }]
          };
        }));
        showToast(`Đã cập nhật trạng thái tin báo ${repId}`);
      };

      // --- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ CÓ HÌNH NỀN LOGO BIÊN PHÒNG ---
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-bp-dark relative flex items-center justify-center p-4 overflow-hidden">
            {/* Logo Bộ đội Biên phòng Việt Nam làm nền chìm lớn ở giữa */}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-15">
              <BorderGuardLogo size={540} />
            </div>

            <div className="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border-2 border-yellow-400 overflow-hidden">
              <div className="bg-bp-green text-white p-6 text-center border-b-4 border-yellow-400">
                <div className="flex justify-center mb-3">
                  <BorderGuardLogo size={95} className="drop-shadow-lg" />
                </div>
                <h1 className="text-xl font-extrabold uppercase tracking-wide text-yellow-300">
                  Bộ đội Biên Phòng Điện Biên
                </h1>
                <p className="text-xs text-green-100 mt-1">
                  Hệ thống Quản lý Địa bàn & Tiếp nhận Tin báo Nhân dân
                </p>
              </div>

              <div className="p-6">
                <div className="flex rounded-lg bg-gray-100 p-1 mb-5">
                  <button
                    onClick={() => setAuthMode('login')}
                    className={`flex-1 py-2 text-sm font-bold rounded-md transition ${authMode === 'login' ? 'bg-bp-green text-white shadow' : 'text-gray-600'}`}
                  >
                    Đăng nhập
                  </button>
                  <button
                    onClick={() => setAuthMode('register')}
                    className={`flex-1 py-2 text-sm font-bold rounded-md transition ${authMode === 'register' ? 'bg-bp-green text-white shadow' : 'text-gray-600'}`}
                  >
                    Đăng ký tài khoản
                  </button>
                </div>

                <form onSubmit={(e) => { e.preventDefault(); setIsLoggedIn(true); }} className="space-y-4">
                  {authMode === 'register' && (
                    <div>
                      <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Họ và tên</label>
                      <input type="text" required placeholder="Nhập họ tên đầy đủ..." className="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700" />
                    </div>
                  )}
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Số điện thoại / Mã định danh</label>
                    <input type="text" defaultValue="0912345678" required className="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Mật khẩu</label>
                    <input type="password" defaultValue="••••••••" required className="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Chọn Cấp truy cập để kiểm thử</label>
                    <select
                      value={role}
                      onChange={(e) => setRole(e.target.value)}
                      className="w-full px-3 py-2 border rounded-lg text-sm font-semibold bg-green-50 text-bp-green"
                    >
                      <option value="dan">Cấp 1: Người dân biên giới</option>
                      <option value="don">Cấp 2: Đồn Biên phòng quản lý khu vực</option>
                      <option value="bch">Cấp 3: Ban Chỉ huy BĐBP Tỉnh Điện Biên</option>
                    </select>
                  </div>

                  <button type="submit" className="w-full bg-bp-green hover:bg-bp-dark text-yellow-300 font-bold py-3 rounded-lg shadow-lg uppercase tracking-wider text-sm transition">
                    {authMode === 'login' ? 'Vào Hệ Thống' : 'Hoàn Tất Đăng Ký'}
                  </button>
                </form>
              </div>
            </div>
          </div>
        );
      }

      // Lọc bài viết chờ duyệt và tin báo theo quyền của Đồn Biên phòng hoặc Ban Chỉ huy
      const pendingPostsForMe = posts.filter(p => {
        if (p.status !== 'pending') return false;
        if (role === 'bch') return true;
        if (role === 'don') return p.areaId === assignedStationId;
        return false;
      });

      const reportsForMe = reports.filter(r => {
        if (role === 'bch') return true; // Ban chỉ huy nhận toàn bộ
        if (role === 'don') return r.areaId === assignedStationId; // Đồn nhận tin trong khu vực
        return true; // Dân xem tin của mình đã gửi
      });

      return (
        <div className="min-h-screen flex flex-col">
          {/* Thông báo Toast */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-bp-green text-white px-5 py-3 rounded-xl shadow-2xl border-2 border-yellow-400 flex items-center gap-3 max-w-md animate-bounce">
              <span className="text-yellow-300 font-bold text-lg">★</span>
              <span className="text-sm font-medium">{toastMsg}</span>
            </div>
          )}

          {/* HEADER CHÍNH MÀU XANH BIÊN PHÒNG */}
          <header className="bg-bp-green text-white border-b-4 border-yellow-400 shadow-lg sticky top-0 z-30">
            <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <BorderGuardLogo size={54} className="shrink-0 drop-shadow" />
                <div>
                  <h1 className="text-lg md:text-xl font-extrabold tracking-wide text-yellow-300 uppercase">
                    Bộ đội Biên Phòng Điện Biên
                  </h1>
                  <p className="text-xs text-green-100">
                    Kết nối Nhân dân • Quản lý Địa bàn • Tiếp nhận Tin báo 3 Cấp
                  </p>
                </div>
              </div>

              {/* Bộ chuyển đổi nhanh 3 cấp để test */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="bg-bp-dark px-3 py-1.5 rounded-lg border border-green-600 flex items-center gap-2">
                  <span className="text-xs text-yellow-300 font-bold">Đang xem với vai trò:</span>
                  <select
                    value={role}
                    onChange={(e) => {
                      setRole(e.target.value);
                      setActiveTab('feed');
                    }}
                    className="bg-white text-bp-green text-xs font-bold px-2 py-1 rounded focus:outline-none"
                  >
                    <option value="dan">👤 Cấp 1: Người dân</option>
                    <option value="don">🛡️ Cấp 2: Đồn Biên phòng</option>
                    <option value="bch">⭐ Cấp 3: Ban Chỉ huy BĐBP Tỉnh</option>
                  </select>
                </div>

                {role === 'don' && (
                  <select
                    value={assignedStationId}
                    onChange={(e) => setAssignedStationId(e.target.value)}
                    className="bg-yellow-400 text-bp-dark text-xs font-extrabold px-2.5 py-2 rounded-lg"
                  >
                    {DON_BIEN_PHONG.filter(d => d.id !== 'all').map(d => (
                      <option key={d.id} value={d.id}>{d.station}</option>
                    ))}
                  </select>
                )}

                <button
                  onClick={() => setIsLoggedIn(false)}
                  className="bg-red-700 hover:bg-red-800 text-white text-xs font-bold px-3 py-2 rounded-lg transition"
                >
                  Màn hình Đăng nhập
                </button>
              </div>
            </div>

            {/* THANH ĐIỀU HƯỚNG CHỨC NĂNG */}
            <div className="bg-bp-dark">
              <div className="max-w-6xl mx-auto px-4 flex overflow-x-auto space-x-2 py-2">
                <button
                  onClick={() => setActiveTab('feed')}
                  className={`px-4 py-2 rounded-lg text-xs md:text-sm font-bold whitespace-nowrap transition ${activeTab === 'feed' ? 'bg-yellow-400 text-bp-dark shadow' : 'text-green-100 hover:bg-green-800'}`}
                >
                  📰 Bảng tin Biên giới
                </button>

                <button
                  onClick={() => setActiveTab('report')}
                  className={`px-4 py-2 rounded-lg text-xs md:text-sm font-bold whitespace-nowrap transition ${activeTab === 'report' ? 'bg-yellow-400 text-bp-dark shadow' : 'text-green-100 hover:bg-green-800'}`}
                >
                  🚨 {role === 'dan' ? 'Gửi Tin Báo Vụ Việc' : 'Danh Sách Tin Báo Tự Động'} ({reportsForMe.length})
                </button>

                {(role === 'don' || role === 'bch') && (
                  <button
                    onClick={() => setActiveTab('moderation')}
                    className={`px-4 py-2 rounded-lg text-xs md:text-sm font-bold whitespace-nowrap transition flex items-center gap-1.5 ${activeTab === 'moderation' ? 'bg-yellow-400 text-bp-dark shadow' : 'text-green-100 hover:bg-green-800'}`}
                  >
                    <span>✅ Duyệt Bài Đăng Của Dân</span>
                    {pendingPostsForMe.length > 0 && (
                      <span className="bg-red-600 text-white px-2 py-0.5 rounded-full text-xs">
                        {pendingPostsForMe.length}
                      </span>
                    )}
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* NỘI DUNG CHÍNH */}
          <main className="max-w-6xl mx-auto w-full px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* CỘT TRÁI: THÔNG TIN PHÂN CẤP & ĐỊA BÀN */}
            <div className="space-y-4">
              <div className="bg-white rounded-xl shadow p-4 border-t-4 border-bp-green">
                <div className="flex items-center gap-3 mb-3">
                  <BorderGuardLogo size={44} />
                  <div>
                    <div className="text-xs font-bold text-gray-500 uppercase">Cấp tài khoản hiện tại</div>
                    <div className="text-sm font-extrabold text-bp-green">
                      {role === 'dan' && 'CẤP 1: NGƯỜI DÂN ĐỊA BÀN'}
                      {role === 'don' && `CẤP 2: ${DON_BIEN_PHONG.find(d => d.id === assignedStationId)?.station.toUpperCase()}`}
                      {role === 'bch' && 'CẤP 3: BAN CHỈ HUY BĐBP TỈNH'}
                    </div>
                  </div>
                </div>

                <div className="text-xs text-gray-600 bg-green-50 p-3 rounded-lg border border-green-200 space-y-1.5">
                  <p className="font-bold text-bp-green">Quy tắc vận hành tự động:</p>
                  <p>• <b>Tin báo của Dân:</b> Tự động gửi thẳng tới tài khoản <b>Đồn Biên phòng</b> nơi xảy ra vụ việc VÀ <b>Ban Chỉ huy</b>.</p>
                  <p>• <b>Bài đăng của Dân:</b> Phải được <b>Đồn Biên phòng</b> quản lý khu vực đó hoặc <b>Ban Chỉ huy</b> duyệt mới hiển thị công khai.</p>
                </div>
              </div>

              {/* Bộ lọc Địa bàn Đồn Biên phòng */}
              <div className="bg-white rounded-xl shadow p-4">
                <h3 className="text-sm font-extrabold text-bp-green uppercase mb-3">
                  📍 Lọc theo Địa bàn Đồn Biên phòng
                </h3>
                <div className="space-y-1.5">
                  {DON_BIEN_PHONG.map(area => (
                    <button
                      key={area.id}
                      onClick={() => setSelectedAreaFilter(area.id)}
                      className={`w-full text-left px-3 py-2 rounded-lg text-xs font-semibold transition flex justify-between items-center ${selectedAreaFilter === area.id ? 'bg-bp-green text-white' : 'hover:bg-gray-100 text-gray-700'}`}
                    >
                      <span>{area.name}</span>
                      <span className={`text-[10px] px-1.5 py-0.5 rounded ${selectedAreaFilter === area.id ? 'bg-yellow-400 text-bp-dark font-bold' : 'bg-gray-200 text-gray-600'}`}>
                        {area.station.replace('Đồn Biên phòng ', 'Đồn ')}
                      </span>
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* CỘT PHẢI (2 CỘT): HIỂN THỊ THEO TAB */}
            <div className="lg:col-span-2 space-y-6">
              {/* TAB 1: BẢNG TIN CỘNG ĐỒNG */}
              {activeTab === 'feed' && (
                <>
                  {/* Khung đăng bài mới */}
                  <div className="bg-white rounded-xl shadow p-4 border border-green-200">
                    <h3 className="text-sm font-extrabold text-bp-green uppercase mb-3">
                      ✍️ Đăng bài lên Bảng tin Biên giới
                    </h3>
                    <form onSubmit={handleCreatePost} className="space-y-3">
                      <textarea
                        rows="3"
                        value={newPostContent}
                        onChange={(e) => setNewPostContent(e.target.value)}
                        placeholder={role === 'dan' ? "Chia sẻ thông tin, hoạt động tại thôn bản của bạn (Bài viết sẽ được Đồn Biên phòng hoặc Ban Chỉ huy duyệt trước khi hiển thị)..." : "Đăng thông báo tuyên truyền chính thức của đơn vị..."}
                        className="w-full p-3 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-green-700"
                      />
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-bold text-gray-600">Khu vực:</span>
                          <select
                            value={newPostArea}
                            onChange={(e) => setNewPostArea(e.target.value)}
                            className="border rounded-lg px-2.5 py-1.5 text-xs font-semibold text-bp-green bg-green-50"
                          >
                            {DON_BIEN_PHONG.filter(d => d.id !== 'all').map(d => (
                              <option key={d.id} value={d.id}>{d.name} ({d.station})</option>
                            ))}
                          </select>
                        </div>
                        <button type="submit" className="bg-bp-green hover:bg-bp-dark text-yellow-300 font-bold text-xs px-5 py-2.5 rounded-lg shadow uppercase">
                          {role === 'dan' ? 'Gửi bài chờ duyệt' : 'Đăng bài ngay'}
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* Danh sách bài viết đã duyệt */}
                  <div className="space-y-4">
                    {posts
                      .filter(p => p.status === 'approved' && (selectedAreaFilter === 'all' || p.areaId === selectedAreaFilter))
                      .map(post => {
                        const areaObj = DON_BIEN_PHONG.find(d => d.id === post.areaId);
                        return (
                          <div key={post.id} className="bg-white rounded-xl shadow p-5 border-l-4 border-bp-green">
                            <div className="flex items-start justify-between mb-2">
                              <div className="flex items-center gap-2.5">
                                <BorderGuardLogo size={38} />
                                <div>
                                  <h4 className="font-bold text-sm text-gray-900">{post.author}</h4>
                                  <p className="text-xs text-gray-500">
                                    {post.time} • 📍 {areaObj?.name} ({areaObj?.station})
                                  </p>
                                </div>
                              </div>
                              <span className="bg-green-100 text-bp-green text-[11px] font-bold px-2.5 py-1 rounded-full">
                                ✓ Đã duyệt bởi: {post.approvedBy}
                              </span>
                            </div>
                            <p className="text-sm text-gray-800 my-3 leading-relaxed">{post.content}</p>
                            <div className="flex items-center justify-between pt-3 border-t text-xs text-gray-500">
                              <button className="font-bold text-bp-green hover:underline">
                                👍 Thích ({post.likes})
                              </button>
                              <span>Phạm vi: {areaObj?.station}</span>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </>
              )}

              {/* TAB 2: GỬI TIN BÁO & THEO DÕI TIN BÁO TỰ ĐỘNG */}
              {activeTab === 'report' && (
                <div className="space-y-6">
                  {/* Form gửi tin báo dành cho Người dân */}
                  <div className="bg-white rounded-xl shadow p-5 border-t-4 border-red-600">
                    <h3 className="text-base font-extrabold text-red-700 uppercase mb-1">
                      🚨 Gửi Tin Báo Tố Giác / Sự Việc Biên Giới
                    </h3>
                    <p className="text-xs text-gray-600 mb-4">
                      Khi bấm gửi, tin báo sẽ <b>tự động chuyển tới tài khoản Đồn Biên phòng quản lý địa bàn nơi xảy ra vụ việc VÀ Ban Chỉ huy BĐBP Tỉnh</b>.
                    </p>

                    <form onSubmit={handleSendReport} className="space-y-3">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Địa bàn xảy ra vụ việc *</label>
                          <select
                            value={reportArea}
                            onChange={(e) => setReportArea(e.target.value)}
                            className="w-full border rounded-lg px-3 py-2 text-xs font-bold text-bp-green bg-green-50"
                          >
                            {DON_BIEN_PHONG.filter(d => d.id !== 'all').map(d => (
                              <option key={d.id} value={d.id}>{d.name} → {d.station}</option>
                            ))}
                          </select>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Loại tin báo *</label>
                          <select
                            value={reportCategory}
                            onChange={(e) => setReportCategory(e.target.value)}
                            className="w-full border rounded-lg px-3 py-2 text-xs font-semibold"
                          >
                            <option>Vượt biên trái phép / Người lạ mặt</option>
                            <option>Xâm phạm cột mốc / Đường biên</option>
                            <option>Buôn lậu / Vận chuyển hàng cấm</option>
                            <option>An ninh trật tự / Thiên tai sạt lở</option>
                          </select>
                        </div>
                      </div>

                      {/* Hộp hiển thị đơn vị nhận tự động */}
                      <div className="bg-yellow-50 border border-yellow-300 rounded-lg p-3 text-xs">
                        <div className="font-bold text-bp-green mb-1">📡 Tự động định tuyến người nhận:</div>
                        <div>1. <b>Đơn vị trực tiếp:</b> {DON_BIEN_PHONG.find(d => d.id === reportArea)?.station}</div>
                        <div>2. <b>Đơn vị chỉ huy cấp trên:</b> Ban Chỉ huy BĐBP Tỉnh Điện Biên</div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        <div className="md:col-span-2">
                          <label className="block text-xs font-bold text-gray-700 mb-1">Tiêu đề sự việc *</label>
                          <input
                            type="text"
                            required
                            value={reportTitle}
                            onChange={(e) => setReportTitle(e.target.value)}
                            placeholder="Ví dụ: Phát hiện người lạ mặt gần mốc quốc giới..."
                            className="w-full border rounded-lg px-3 py-2 text-sm"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-700 mb-1">Mức độ khẩn cấp</label>
                          <select
                            value={reportPriority}
                            onChange={(e) => setReportPriority(e.target.value)}
                            className="w-full border rounded-lg px-3 py-2 text-sm font-bold text-red-700"
                          >
                            <option value="urgent">🔥 Khẩn cấp</option>
                            <option value="high">⚠️ Cao</option>
                            <option value="normal">Bình thường</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-gray-700 mb-1">Nội dung chi tiết & Vị trí *</label>
                        <textarea
                          rows="3"
                          required
                          value={reportDesc}
                          onChange={(e) => setReportDesc(e.target.value)}
                          placeholder="Mô tả cụ thể thời gian, địa điểm, đặc điểm đối tượng hoặc sự việc..."
                          className="w-full border rounded-lg p-3 text-sm"
                        />
                      </div>

                      <button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3 rounded-lg shadow uppercase text-xs tracking-wider">
                        🚀 Gửi Tin Báo Ngay Tới Đồn Biên Phòng & Ban Chỉ Huy
                      </button>
                    </form>
                  </div>

                  {/* Danh sách Tin báo */}
                  <div className="space-y-4">
                    <h4 className="text-sm font-extrabold text-bp-green uppercase">
                      📋 Hồ sơ Tin báo ({reportsForMe.length})
                    </h4>
                    {reportsForMe.map(rep => (
                      <div key={rep.id} className="bg-white rounded-xl shadow p-5 border-l-4 border-red-600 space-y-3">
                        <div className="flex flex-wrap justify-between items-start gap-2">
                          <div>
                            <span className="bg-red-100 text-red-800 text-xs font-extrabold px-2 py-0.5 rounded mr-2">
                              {rep.id}
                            </span>
                            <span className="text-xs font-bold text-gray-500">{rep.category} • {rep.time}</span>
                            <h5 className="text-base font-extrabold text-gray-900 mt-1">{rep.title}</h5>
                          </div>
                          <span className="bg-green-100 text-bp-green text-xs font-extrabold px-3 py-1 rounded-full uppercase">
                            {rep.status === 'submitted' ? 'Mới gửi' : rep.status === 'received' ? 'Đồn đang xác minh' : 'Đã xử lý'}
                          </span>
                        </div>

                        <p className="text-sm text-gray-700 bg-gray-50 p-3 rounded-lg">{rep.description}</p>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs bg-green-50 p-3 rounded-lg border border-green-200">
                          <div><b>Đồn tiếp nhận:</b> {rep.targetStation}</div>
                          <div><b>Đồng kính gửi:</b> {rep.ccCommand}</div>
                        </div>

                        {/* Lịch sử xử lý */}
                        <div className="text-xs space-y-1 pt-2 border-t">
                          <div className="font-bold text-gray-600">Nhật ký điều phối & xử lý:</div>
                          {rep.history.map((h, i) => (
                            <div key={i} className="text-gray-600">• {h.step} <span className="text-gray-400">({h.time})</span></div>
                          ))}
                        </div>

                        {/* Nút tác nghiệp cho Đồn Biên phòng hoặc Ban Chỉ huy */}
                        {(role === 'don' || role === 'bch') && (
                          <div className="flex flex-wrap gap-2 pt-2">
                            <button
                              onClick={() => handleUpdateReportStatus(rep.id, 'received', 'Đã tiếp nhận tin báo & cử lực lượng xuống địa bàn')}
                              className="bg-bp-green text-white text-xs font-bold px-3 py-1.5 rounded-lg"
                            >
                              ✓ Tiếp nhận & Xác minh
                            </button>
                            <button
                              onClick={() => handleUpdateReportStatus(rep.id, 'resolved', 'Đã xử lý xong vụ việc, tình hình địa bàn ổn định')}
                              className="bg-yellow-500 text-bp-dark text-xs font-extrabold px-3 py-1.5 rounded-lg"
                            >
                              ★ Hoàn tất xử lý
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* TAB 3: DUYỆT BÀI ĐĂNG CỦA DÂN (DÀNH CHO ĐỒN BIÊN PHÒNG & BAN CHỈ HUY) */}
              {activeTab === 'moderation' && (
                <div className="bg-white rounded-xl shadow p-5 border-t-4 border-yellow-400 space-y-4">
                  <h3 className="text-base font-extrabold text-bp-green uppercase">
                    ✅ Hàng Đợi Duyệt Bài Đăng Của Người Dân ({pendingPostsForMe.length})
                  </h3>
                  <p className="text-xs text-gray-600">
                    Bài viết do người dân đăng tại khu vực nào thì <b>Đồn Biên phòng quản lý khu vực đó</b> hoặc <b>Ban Chỉ huy BĐBP Tỉnh</b> có quyền duyệt hiển thị công khai.
                  </p>

                  {pendingPostsForMe.length === 0 ? (
                    <div className="text-center py-8 text-gray-500 text-sm">
                      Hiện không có bài viết nào đang chờ duyệt trong khu vực phụ trách.
                    </div>
                  ) : (
                    pendingPostsForMe.map(post => {
                      const areaObj = DON_BIEN_PHONG.find(d => d.id === post.areaId);
                      return (
                        <div key={post.id} className="border rounded-xl p-4 bg-yellow-50/50 space-y-3">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="font-bold text-sm text-gray-900">{post.author}</span>
                              <p className="text-xs text-bp-green font-semibold">
                                Khu vực đăng: {areaObj?.name} (Thuộc {areaObj?.station})
                              </p>
                            </div>
                            <span className="bg-yellow-300 text-bp-dark text-xs font-bold px-2.5 py-1 rounded-full">
                              Đang chờ duyệt
                            </span>
                          </div>
                          <p className="text-sm text-gray-800 bg-white p-3 rounded-lg border">{post.content}</p>
                          <div className="flex gap-3">
                            <button
                              onClick={() => handleApprovePost(post.id)}
                              className="bg-bp-green hover:bg-bp-dark text-yellow-300 text-xs font-bold px-4 py-2 rounded-lg shadow"
                            >
                              ✓ Phê duyệt hiển thị lên Bảng tin
                            </button>
                            <button
                              onClick={() => handleRejectPost(post.id)}
                              className="bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold px-4 py-2 rounded-lg"
                            >
                              ✕ Từ chối bài đăng
                            </button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
