      const visiblePosts = state.posts.filter(p => (p.status === "approved" || (p.status === "pending" && p.authorId === currentUser.id)) && (stationFilter === "ALL" || p.stationId === stationFilter));
      root.innerHTML = `
        <header class="bg-[#006837] text-white border-b-4 border-yellow-400 shadow-lg sticky top-0 z-30">
          <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <img src="${state.appConfig.logoUrl}" class="w-12 h-12 rounded-full bg-white p-0.5 object-contain"/>
              <div><h1 class="font-black text-lg text-yellow-300 uppercase">${state.appConfig.appName}</h1><p class="text-xs text-emerald-100">${state.appConfig.slogan}</p></div>
            </div>
            <div class="flex items-center gap-2">
              <div class="bg-[#004d28] px-3.5 py-1.5 rounded-xl border border-emerald-600 text-right text-xs"><div class="font-black text-yellow-300">${currentUser.fullName}</div><div class="text-[10px] text-emerald-100">${currentUser.role==="ban_chi_huy"?"Ban Chỉ huy BĐBP Tỉnh (Admin)":currentUser.role==="don_bp"?"Đồn Biên phòng: "+currentUser.stationName:"Người dân địa bàn: "+currentUser.stationName}</div></div>
              <button onclick="isAuthenticated=false;renderApp();" class="bg-red-600 hover:bg-red-700 text-white text-xs font-black px-3.5 py-2 rounded-xl">Đăng Xuất / Đổi TK</button>
            </div>
          </div>
          <div class="bg-[#004d28]"><div class="max-w-6xl mx-auto px-4 flex gap-2 py-2 overflow-x-auto text-xs">
            <button onclick="activeTab='feed';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='feed'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">📰 Bảng Tin Biên Giới</button>
            <button onclick="activeTab='reports';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='reports'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">🚨 Gửi & Theo Dõi Tin Báo (${visibleReps.length})</button>
            ${currentUser.role !== "dan" ? `<button onclick="activeTab='moderation';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='moderation'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">✅ Duyệt Bài Đăng Khu Vực (${pendingList.length})</button>` : ""}
            <button onclick="activeTab='stations';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='stations'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">🛡️ Danh Bạ Đồn BP (${state.stations.length})</button>
          </div></div>
        </header>
        <main class="max-w-6xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6 text-xs">
          <div class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border-t-4 border-[#006837]"><h3 class="font-black text-[#006837] uppercase mb-2">📍 Lọc Địa Bàn Đồn BP</h3><button onclick="stationFilter='ALL';renderApp();" class="w-full text-left px-3 py-2 rounded-xl font-bold mb-1 ${stationFilter==='ALL'?'bg-[#006837] text-white':'hover:bg-slate-100'}">Toàn tỉnh Điện Biên (${state.stations.length} Đồn)</button>${state.stations.map(s => `<button onclick="stationFilter='${s.id}';renderApp();" class="w-full text-left px-3 py-2 rounded-xl font-bold mb-1 ${stationFilter===s.id?'bg-[#006837] text-white':'hover:bg-slate-100'}">${s.name}</button>`).join("")}</div>
          </div>
          <div class="lg:col-span-2 space-y-4">
            ${activeTab === "feed" ? `<div class="bg-white p-5 rounded-2xl shadow-sm border space-y-3"><h3 class="font-black text-sm text-[#006837] uppercase">✍️ Đăng Tin Cộng Đồng Biên Giới</h3><form onsubmit="handleCreatePost(event)" class="space-y-2.5"><input id="postTitle" required placeholder="Tiêu đề bản tin..." class="w-full p-2.5 border rounded-xl font-bold"/><textarea id="postContent" rows="3" required placeholder="Nội dung bài viết..." class="w-full p-2.5 border rounded-xl"></textarea><div class="flex justify-between items-center"><select id="postStation" class="p-2 border rounded-xl font-bold text-[#006837] bg-emerald-50">${state.stations.map(s => `<option value="${s.id}" ${s.id===currentUser.stationId?"selected":""}>${s.name} (${s.area})</option>`).join("")}</select><button type="submit" class="bg-[#006837] text-yellow-300 font-black px-4 py-2 rounded-xl uppercase">${currentUser.role!=="dan"?"Đăng Công Khai Ngay":"Gửi Bài Chờ Duyệt"}</button></div></form></div>${visiblePosts.map(p => `<div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 ${p.status==="approved"?"border-[#006837]":"border-amber-500"} space-y-2.5"><div class="flex justify-between items-start"><div><h4 class="font-black text-sm">${p.title}</h4><p class="text-slate-500">${p.authorName} • 📍 ${p.stationName} • ${p.createdAt}</p></div><span class="${p.status==="approved"?"bg-emerald-100 text-[#006837]":"bg-amber-100 text-amber-800"} font-black px-2.5 py-1 rounded-full h-fit">${p.status==="approved"?"✓ Đã duyệt":"⏳ Đang chờ Đồn BP / BCH duyệt"}</span></div><p class="text-sm text-slate-800">${p.content}</p><div class="flex justify-between items-center pt-2 border-t text-slate-500"><button onclick="handleLikePost('${p.id}')" class="font-black text-[#006837] hover:underline">👍 Quan tâm (${p.likes||0})</button><span>${(p.comments||[]).length} bình luận</span></div><div class="space-y-1.5 pt-2 border-t">${(p.comments||[]).map(c => `<div class="bg-slate-50 p-2 rounded-xl border"><b>${c.author}:</b> ${c.text}</div>`).join("")}<form onsubmit="handleCommentPost(event,'${p.id}')" class="flex gap-2"><input id="cmt_${p.id}" placeholder="Viết bình luận phản hồi..." class="flex-1 p-2 border rounded-xl"/><button type="submit" class="bg-[#006837] text-yellow-300 font-black px-3 py-1.5 rounded-xl">Gửi</button></form></div></div>`).join("")}` : ""}
            ${activeTab === "reports" ? `<div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-red-600 space-y-3"><h3 class="font-black text-sm text-red-700 uppercase">🚨 Gửi Tin Báo Vụ Việc Khẩn Cấp</h3><form onsubmit="handleCreateReport(event)" class="space-y-2.5"><div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><select id="repStation" class="p-2.5 border rounded-xl font-bold text-[#006837] bg-emerald-50">${state.stations.map(s => `<option value="${s.id}" ${s.id===currentUser.stationId?"selected":""}>${s.area} → ${s.name}</option>`).join("")}</select><select id="repCat" class="p-2.5 border rounded-xl font-bold"><option>Vượt biên trái phép / Người lạ mặt</option><option>Xâm phạm cột mốc / Đường biên</option><option>Buôn lậu / Vận chuyển chất cấm</option><option>An ninh trật tự / Thiên tai sạt lở</option></select></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-2"><input id="repTitle" required placeholder="Tiêu đề sự việc..." class="sm:col-span-2 p-2.5 border rounded-xl font-bold"/><select id="repPri" class="p-2.5 border rounded-xl font-black text-red-700"><option value="urgent">🔥 Khẩn cấp</option><option value="high">⚠️ Cao</option><option value="normal">Bình thường</option></select></div><input id="repLoc" placeholder="Vị trí cụ thể..." class="w-full p-2.5 border rounded-xl"/><textarea id="repDesc" rows="3" required placeholder="Mô tả chi tiết sự việc..." class="w-full p-2.5 border rounded-xl"></textarea><button type="submit" class="w-full py-3 bg-red-600 text-white font-black uppercase rounded-xl shadow">🚀 Gửi Tin Báo Tự Động Tới Đồn BP & Ban Chỉ Huy</button></form></div>${visibleReps.map(r => `<div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-red-600 space-y-2"><div class="flex justify-between"><span class="bg-red-100 text-red-800 font-black px-2 py-0.5 rounded">${r.code} • ${r.stationName}</span><span class="font-black text-[#006837] uppercase">${r.status==="new"?"Mới gửi":r.status==="verifying"?"Đang xác minh":"Đã xử lý"}</span></div><h4 class="font-black text-sm">${r.title}</h4><p class="bg-slate-50 p-3 rounded-xl border">${r.description}</p><div class="space-y-1 pt-1 text-slate-600">${(r.timeline||[]).map(t => `<div>• <b>${t.actor}:</b> ${t.action} (${t.time})</div>`).join("")}</div>${currentUser.role !== "dan" ? `<div class="flex gap-2 pt-2"><button onclick="updateReport('${r.id}','verifying','Đã tiếp nhận & cử lực lượng xác minh')" class="bg-[#006837] text-yellow-300 font-black px-3 py-1.5 rounded-xl">✓ Tiếp Nhận & Xác Minh</button><button onclick="updateReport('${r.id}','resolved','Đã xử lý hoàn tất vụ việc')" class="bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl">★ Hoàn Tất</button></div>` : ""}</div>`).join("")}` : ""}
            ${activeTab === "moderation" ? `<div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-yellow-400 space-y-3"><h3 class="font-black text-sm text-[#006837] uppercase">✅ Duyệt Bài Đăng Của Người Dân (${pendingList.length})</h3>${pendingList.length === 0 ? `<p class="text-slate-400 py-6 text-center">Không có bài chờ duyệt trong khu vực.</p>` : pendingList.map(p => `<div class="p-4 rounded-xl border bg-amber-50/50 space-y-2"><div class="font-black text-sm">${p.title}</div><div class="text-[#006837] font-bold">${p.authorName} • ${p.stationName}</div><p class="bg-white p-3 rounded-xl border">${p.content}</p><div class="flex gap-2"><button onclick="moderatePost('${p.id}','approved')" class="bg-[#006837] text-yellow-300 font-black px-4 py-2 rounded-xl">✓ Phê Duyệt</button><button onclick="moderatePost('${p.id}','rejected')" class="bg-red-600 text-white font-black px-4 py-2 rounded-xl">✕ Từ Chối</button></div></div>`).join("")}</div>` : ""}
            ${activeTab === "stations" ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${state.stations.map(s => `<div class="bg-white p-4 rounded-2xl border shadow-sm space-y-1"><span class="bg-[#006837] text-yellow-300 font-mono font-black px-2 py-0.5 rounded">${s.code}</span><h4 class="font-black text-sm mt-1">${s.name}</h4><p><b>Địa bàn:</b> ${s.area}</p><p><b>Cột mốc:</b> ${s.markers}</p><p class="text-[#006837] font-bold">Chỉ huy: ${s.commander} • ĐT: ${s.hotline}</p></div>`).join("")}</div>` : ""}
          </div>
        </main>`;
    }
    renderApp();
  </script>
</body>
</html>
