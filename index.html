    const STORAGE_KEY = "BDBP_DIEN_BIEN_SHARED_STATE_V2";
    const bc = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("bdbp_sync_channel") : null;
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : INITIAL_DATA;
      } catch (e) { return INITIAL_DATA; }
    }
    function saveState(next) {
      state = next;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      if (bc) bc.postMessage({ type: "SYNC" });
      renderApp();
    }
    if (bc) bc.onmessage = () => { state = loadState(); renderApp(); };
    let state = loadState();
    let currentUser = state.users[0] || INITIAL_DATA.users[0];
    let isAuthenticated = true;
    let activeTab = "feed";
    let stationFilter = "ALL";
    function loginWithUser(userId) {
      const u = state.users.find(x => x.id === userId);
      if (u) {
        if (u.status === "locked") { alert("Tài khoản đã bị khóa!"); return; }
        currentUser = u; isAuthenticated = true; activeTab = "feed"; renderApp();
      }
    }
    function handleLoginSubmit(e) {
      e.preventDefault();
      const uName = document.getElementById("loginUser").value.trim().toLowerCase();
      const uPass = document.getElementById("loginPass").value.trim();
      const found = state.users.find(u => u.username.toLowerCase() === uName && u.password === uPass);
      if (!found) { alert("Sai tên đăng nhập hoặc mật khẩu!"); return; }
      if (found.status === "locked") { alert("Tài khoản này đã bị khóa!"); return; }
      currentUser = found; isAuthenticated = true; activeTab = "feed"; renderApp();
    }
    function handleCreatePost(e) {
      e.preventDefault();
      const title = document.getElementById("postTitle").value.trim();
      const content = document.getElementById("postContent").value.trim();
      const stId = currentUser.role === "don_bp" ? currentUser.stationId : document.getElementById("postStation").value;
      if (!title || !content) return;
      const stObj = state.stations.find(s => s.id === stId) || state.stations[0];
      const isAuto = currentUser.role === "ban_chi_huy";
      const newPost = {
        id: "post_" + Date.now(),
        stationId: stObj.id, stationName: stObj.name,
        authorId: currentUser.id, authorName: currentUser.fullName, authorRole: currentUser.role,
        title, content, status: isAuto ? "approved" : "pending",
        approvedBy: isAuto ? currentUser.fullName : null, likes: 0,
        createdAt: new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"}) + " - " + new Date().toLocaleDateString("vi-VN"),
        comments: []
      };
      state.posts.unshift(newPost);
      saveState(state);
    }
    function handleCreateReport(e) {
      e.preventDefault();
      const stId = document.getElementById("repStation").value;
      const cat = document.getElementById("repCat").value;
      const pri = document.getElementById("repPri").value;
      const title = document.getElementById("repTitle").value.trim();
      const loc = document.getElementById("repLoc").value.trim();
      const desc = document.getElementById("repDesc").value.trim();
      if (!title || !desc) return;
      const stObj = state.stations.find(s => s.id === stId) || state.stations[0];
      const now = new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
      const newRep = {
        id: "rep_" + Date.now(), code: "TB-DBP-" + Math.floor(100 + Math.random()*900),
        stationId: stObj.id, stationName: stObj.name, ccCommand: "Ban Chỉ huy BĐBP Tỉnh Điện Biên",
        senderId: currentUser.id, senderName: currentUser.fullName, senderPhone: currentUser.phone || "0912.345.678",
        category: cat, priority: pri, title, description: desc, location: loc || stObj.area,
        status: "new", createdAt: now + " - " + new Date().toLocaleDateString("vi-VN"),
        timeline: [{ actor: "Hệ thống Định tuyến Tự động", action: "Đã chuyển đồng thời tới [" + stObj.name + "] VÀ [Ban Chỉ huy BĐBP Tỉnh]", time: now }]
      };
      state.reports.unshift(newRep);
      saveState(state);
    }
    function moderatePost(postId, status) {
      state.posts = state.posts.map(p => p.id === postId ? { ...p, status, approvedBy: currentUser.fullName } : p);
      saveState(state);
    }
    function updateReport(repId, status, label) {
      const now = new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
      state.reports = state.reports.map(r => r.id === repId ? { ...r, status, timeline: [...(r.timeline||[]), { actor: currentUser.fullName, action: label, time: now }] } : r);
      saveState(state);
    }

        return;
      }
      const pendingList = state.posts.filter(p => p.status === "pending" && (currentUser.role === "ban_chi_huy" || (currentUser.role === "don_bp" && p.stationId === currentUser.stationId)));
      const visibleReps = currentUser.role === "ban_chi_huy" ? state.reports : currentUser.role === "don_bp" ? state.reports.filter(r => r.stationId === currentUser.stationId) : state.reports.filter(r => r.senderId === currentUser.id);

      root.innerHTML = `
        <header class="bg-[#006837] text-white border-b-4 border-yellow-400 shadow-lg sticky top-0 z-30">
          <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <img src="${state.appConfig.logoUrl}" class="w-12 h-12 rounded-full bg-white p-0.5 object-contain"/>
              <div><h1 class="font-black text-lg text-yellow-300 uppercase">${state.appConfig.appName}</h1><p class="text-xs text-emerald-100">${state.appConfig.slogan}</p></div>
            </div>
            <div class="flex items-center gap-2">
              <div class="bg-[#004d28] px-3 py-1.5 rounded-xl border border-emerald-600 text-right text-xs"><div class="font-black text-yellow-300">${currentUser.fullName}</div><div class="text-[10px] text-emerald-100">${currentUser.stationName}</div></div>
              <button onclick="isAuthenticated=false;renderApp();" class="bg-red-600 hover:bg-red-700 text-white text-xs font-black px-3 py-2 rounded-xl">Đổi Tài Khoản</button>
            </div>
          </div>
          <div class="bg-[#004d28]"><div class="max-w-6xl mx-auto px-4 flex gap-2 py-2 overflow-x-auto text-xs">
            <button onclick="activeTab='feed';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='feed'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">📰 Bảng Tin Biên Giới</button>
            <button onclick="activeTab='reports';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='reports'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">🚨 Tin Báo Vụ Việc (${visibleReps.length})</button>
            ${currentUser.role !== "dan" ? `<button onclick="activeTab='moderation';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='moderation'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">✅ Duyệt Bài Đăng (${pendingList.length})</button>` : ""}
            <button onclick="activeTab='stations';renderApp();" class="px-4 py-2 rounded-xl font-black ${activeTab==='stations'?'bg-yellow-400 text-[#00381d]':'text-emerald-100'}">🛡️ Danh Bạ Đồn BP (${state.stations.length})</button>
          </div></div>
        </header>
        <main class="max-w-6xl mx-auto w-full px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6 text-xs">
          <div class="space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border-t-4 border-[#006837]"><h3 class="font-black text-[#006837] uppercase mb-2">Lọc Địa Bàn Đồn BP</h3><button onclick="stationFilter='ALL';renderApp();" class="w-full text-left px-3 py-2 rounded-xl font-bold mb-1 ${stationFilter==='ALL'?'bg-[#006837] text-white':'hover:bg-slate-100'}">Toàn tỉnh Điện Biên</button>${state.stations.map(s => `<button onclick="stationFilter='${s.id}';renderApp();" class="w-full text-left px-3 py-2 rounded-xl font-bold mb-1 ${stationFilter===s.id?'bg-[#006837] text-white':'hover:bg-slate-100'}">${s.name}</button>`).join("")}</div>
          </div>
          <div class="lg:col-span-2 space-y-4">
            ${activeTab === "feed" ? `<div class="bg-white p-5 rounded-2xl shadow-sm border space-y-3"><h3 class="font-black text-sm text-[#006837] uppercase">✍️ Đăng Tin Cộng Đồng Biên Giới</h3><form onsubmit="handleCreatePost(event)" class="space-y-2.5"><input id="postTitle" required placeholder="Tiêu đề bản tin..." class="w-full p-2.5 border rounded-xl font-bold"/><textarea id="postContent" rows="3" required placeholder="Nội dung bài viết..." class="w-full p-2.5 border rounded-xl"></textarea><div class="flex justify-between items-center"><select id="postStation" class="p-2 border rounded-xl font-bold text-[#006837] bg-emerald-50">${state.stations.map(s => `<option value="${s.id}">${s.name}</option>`).join("")}</select><button type="submit" class="bg-[#006837] text-yellow-300 font-black px-4 py-2 rounded-xl uppercase">${currentUser.role==="ban_chi_huy"?"Đăng Ngay":"Gửi Chờ Duyệt"}</button></div></form></div>${approvedPosts.map(p => `<div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-[#006837] space-y-2"><div class="flex justify-between"><div><h4 class="font-black text-sm">${p.title}</h4><p class="text-slate-500">${p.authorName} • 📍 ${p.stationName} • ${p.createdAt}</p></div><span class="bg-emerald-100 text-[#006837] font-black px-2.5 py-1 rounded-full h-fit">✓ Đã duyệt</span></div><p class="text-sm text-slate-800">${p.content}</p></div>`).join("")}` : ""}
            ${activeTab === "reports" ? `<div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-red-600 space-y-3"><h3 class="font-black text-sm text-red-700 uppercase">🚨 Gửi Tin Báo Vụ Việc Khẩn Cấp</h3><form onsubmit="handleCreateReport(event)" class="space-y-2.5"><div class="grid grid-cols-1 sm:grid-cols-2 gap-2"><select id="repStation" class="p-2.5 border rounded-xl font-bold text-[#006837] bg-emerald-50">${state.stations.map(s => `<option value="${s.id}">${s.area} → ${s.name}</option>`).join("")}</select><select id="repCat" class="p-2.5 border rounded-xl font-bold"><option>Vượt biên trái phép / Người lạ mặt</option><option>Xâm phạm cột mốc / Đường biên</option><option>Buôn lậu / Vận chuyển chất cấm</option></select></div><div class="grid grid-cols-1 sm:grid-cols-3 gap-2"><input id="repTitle" required placeholder="Tiêu đề sự việc..." class="sm:col-span-2 p-2.5 border rounded-xl font-bold"/><select id="repPri" class="p-2.5 border rounded-xl font-black text-red-700"><option value="urgent">🔥 Khẩn cấp</option><option value="high">⚠️ Cao</option></select></div><input id="repLoc" placeholder="Vị trí cụ thể..." class="w-full p-2.5 border rounded-xl"/><textarea id="repDesc" rows="3" required placeholder="Mô tả chi tiết sự việc..." class="w-full p-2.5 border rounded-xl"></textarea><button type="submit" class="w-full py-3 bg-red-600 text-white font-black uppercase rounded-xl">🚀 Gửi Tin Báo Tự Động Tới Đồn BP & Ban Chỉ Huy</button></form></div>${visibleReps.map(r => `<div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-red-600 space-y-2"><div class="flex justify-between"><span class="bg-red-100 text-red-800 font-black px-2 py-0.5 rounded">${r.code} • ${r.stationName}</span><span class="font-black text-[#006837] uppercase">${r.status}</span></div><h4 class="font-black text-sm">${r.title}</h4><p class="bg-slate-50 p-3 rounded-xl border">${r.description}</p>${currentUser.role !== "dan" ? `<div class="flex gap-2 pt-2"><button onclick="updateReport('${r.id}','verifying','Đã tiếp nhận & cử lực lượng xác minh')" class="bg-[#006837] text-yellow-300 font-black px-3 py-1.5 rounded-xl">✓ Tiếp Nhận & Xác Minh</button><button onclick="updateReport('${r.id}','resolved','Đã xử lý hoàn tất vụ việc')" class="bg-amber-400 text-slate-950 font-black px-3 py-1.5 rounded-xl">★ Hoàn Tất</button></div>` : ""}</div>`).join("")}` : ""}
            ${activeTab === "moderation" ? `<div class="bg-white p-5 rounded-2xl shadow-sm border-t-4 border-yellow-400 space-y-3"><h3 class="font-black text-sm text-[#006837] uppercase">✅ Duyệt Bài Đăng Của Người Dân (${pendingList.length})</h3>${pendingList.length === 0 ? `<p class="text-slate-400 py-6 text-center">Không có bài chờ duyệt.</p>` : pendingList.map(p => `<div class="p-4 rounded-xl border bg-amber-50/50 space-y-2"><div class="font-black text-sm">${p.title}</div><div class="text-[#006837] font-bold">${p.authorName} • ${p.stationName}</div><p class="bg-white p-3 rounded-xl border">${p.content}</p><div class="flex gap-2"><button onclick="moderatePost('${p.id}','approved')" class="bg-[#006837] text-yellow-300 font-black px-4 py-2 rounded-xl">✓ Phê Duyệt</button><button onclick="moderatePost('${p.id}','rejected')" class="bg-red-600 text-white font-black px-4 py-2 rounded-xl">✕ Từ Chối</button></div></div>`).join("")}</div>` : ""}
            ${activeTab === "stations" ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${state.stations.map(s => `<div class="bg-white p-4 rounded-2xl border shadow-sm space-y-1"><span class="bg-[#006837] text-yellow-300 font-mono font-black px-2 py-0.5 rounded">${s.code}</span><h4 class="font-black text-sm mt-1">${s.name}</h4><p><b>Địa bàn:</b> ${s.area}</p><p><b>Cột mốc:</b> ${s.markers}</p><p class="text-[#006837] font-bold">Chỉ huy: ${s.commander} • ĐT: ${s.hotline}</p></div>`).join("")}</div>` : ""}
          </div>
        </main>`;
    }
    renderApp();
  </script>
</body>
</html>
